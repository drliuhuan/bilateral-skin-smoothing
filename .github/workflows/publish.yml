name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
# Upload only when enabled: set the repository variable PYPI_PUBLISH=true after
# configuring PyPI trusted publishing for this repository + the "pypi" environment.
# Until then the release workflow still builds and uploads the dist artifact,
# and the publish job is skipped.

permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: publish to PyPI (trusted publishing)
    needs: build
    if: github.event_name == 'workflow_dispatch' || vars.PYPI_PUBLISH == 'true' 
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
