name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow
      - name: Run unit tests (HSV fallback path)
        run: python tests/test_primitives.py

  test-with-mask:
    name: tests with U-2-Net mask
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow opencv-python-headless
      - name: Fetch U-2-Net-lite weights (Apache-2.0)
        run: python scripts/fetch_u2net.py
      - name: Run unit tests (U-2-Net path)
        run: python tests/test_primitives.py

  package:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build
        run: python -m build
      - name: Smoke-test the wheel in a clean directory
        shell: bash
        run: |
          python -m pip install dist/*.whl
          mkdir -p /tmp/smoke && cd /tmp/smoke
          python - <<'PY'
          import numpy as np
          import skin_smoothing as P
          img = np.random.default_rng(0).random((48, 48, 3))
          res = P.smooth_skin(img, smoothing=60)
          assert res["output"].shape == img.shape
          print("version:", getattr(P, "__version__", "?"))
          print("smoke ok, mask mean:", float(res["mask"].mean()) if res["mask"] is not None else None)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
